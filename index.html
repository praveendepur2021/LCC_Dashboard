<script>
let dashboardData = {
  matches: [],
  pointsTable: [],
  stats: []
};

async function loadCricClubsData() {
  const response = await fetch("data.json?t=" + new Date().getTime());
  dashboardData = await response.json();

  renderMatches();
  renderPointsTable();
  renderStats();
}

function renderMatches() {
  const tbody = document.getElementById("matchesBody");
  tbody.innerHTML = "";

  dashboardData.matches.forEach(match => {
    tbody.innerHTML += `
      <tr>
        <td>${match.tournament}</td>
        <td>${match.team}</td>
        <td>${match.rawText}</td>
        <td>
          <a href="${match.scorecardUrl}" target="_blank">Scorecard</a>
        </td>
      </tr>
    `;
  });
}

function renderPointsTable() {
  const tbody = document.getElementById("pointsBody");
  tbody.innerHTML = "";

  dashboardData.pointsTable.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.tournament}</td>
        <td>${row.team}</td>
        <td>${row.rawText}</td>
      </tr>
    `;
  });
}

function renderStats() {
  const tbody = document.getElementById("statsBody");
  tbody.innerHTML = "";

  dashboardData.stats.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row.tournament}</td>
        <td>${row.rawText}</td>
        <td>
          <a href="${row.sourceUrl}" target="_blank">Source</a>
        </td>
      </tr>
    `;
  });
}

loadCricClubsData();
</script>
